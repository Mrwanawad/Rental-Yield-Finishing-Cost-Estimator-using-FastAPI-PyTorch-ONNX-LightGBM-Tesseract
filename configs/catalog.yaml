# Finishing price catalog, EGP, installed (material + labour). Greater Cairo, Q4 2026.
# Calibrated so totals land near market bands: basic ~6-8k, standard ~10-13k, premium ~19-25k EGP/m2 net.
# Update `catalog_date` with every price refresh; the cost model adds inflation drift since this date.
catalog_date: "2026-10-01"
monthly_inflation: 0.012
ceiling_height_m: 2.9
wall_to_floor_ratio_fallback: 2.6
contingency: {basic: 0.10, standard: 0.12, premium: 0.15}

flooring_per_m2:            # floor area
  dry:      {basic: 900,  standard: 1600, premium: 3800}   # porcelain local / imported / marble
  wet:      {basic: 850,  standard: 1400, premium: 3000}   # anti-slip ceramic / porcelain
  balcony:  {basic: 800,  standard: 1300, premium: 2600}
plaster_per_m2_wall:        {basic: 230,  standard: 260,  premium: 300}
paint_per_m2_wall:          {basic: 180,  standard: 320,  premium: 650}   # 2 coats / putty+3 coats / premium + special finish
ceiling_per_m2:             {basic: 120,  standard: 650,  premium: 1300}  # paint only / partial gypsum / full gypsum + coves
wall_tiles_per_m2:          {basic: 750,  standard: 1300, premium: 3200}  # bathrooms full height, kitchen backsplash
bathroom_set:               {basic: 35000, standard: 75000, premium: 190000}  # sanitary ware, mixers, vanity, shower
guest_wc_factor: 0.6        # bathrooms under 3.5 m2
kitchen_per_linear_m:       {basic: 9000, standard: 16000, premium: 35000}
electrical_per_m2:          {basic: 650,  standard: 1000, premium: 1800}  # wiring, panel, points; premium = smart home
plumbing_per_wet_room:      {basic: 18000, standard: 28000, premium: 45000}
door_each:                  {basic: 7000, standard: 14000, premium: 30000}
ac_unit_by_hp:              {1.5: 38000, 2.25: 48000, 3.0: 60000, 4.0: 85000}
ac_package_factor:          {basic: 1.0, standard: 1.25, premium: 1.8}  # split / inverter / concealed ducted
ac_install_each: 4000

# Delivered "semi-finished" units already have plaster and most electrical/plumbing first fix.
semi_finished_discount: {plaster: 1.0, electrical: 0.6, plumbing: 0.6}
