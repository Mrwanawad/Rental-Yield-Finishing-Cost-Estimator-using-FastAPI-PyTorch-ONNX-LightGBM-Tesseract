[project]
name = "ryfc"
version = "0.1.0"
description = "Rental yield & finishing cost estimator from floor plans (Egypt)"
requires-python = ">=3.11"
# serving dependencies only: ONNX Runtime for the U-Net, exported JSON trees for LightGBM (no torch/lightgbm/pandas)
dependencies = [
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "onnxruntime>=1.18",
    "pypdfium2>=4.30",
    "pytesseract>=0.3.10",
    "pillow>=10.0",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "fpdf2>=2.7",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
]

[project.optional-dependencies]
ui = ["streamlit>=1.35", "plotly>=5.20", "pandas>=2.2"]
train = ["lightgbm>=4.3", "pandas>=2.2", "torch>=2.2", "segmentation-models-pytorch>=0.3.3", "optuna>=3.6", "mlflow-skinny>=2.12", "onnx>=1.16"]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.5", "pandas>=2.2", "lightgbm>=4.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ryfc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "scripts"]

[tool.ruff]
line-length = 130
src = ["src", "scripts", "app"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E731", "B905", "B008"]
